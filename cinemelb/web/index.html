<!DOCTYPE html>
<html lang="en-AU" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cinemelb — Melbourne cinema showtimes</title>
<meta name="description" content="Every film at every Melbourne cinema — multiplex, arthouse and independent — in one page. Search a film, browse a day, or see what is still catchable later today.">
<meta name="theme-color" content="#0b0b14">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b14'/%3E%3Crect x='6' y='8' width='20' height='16' rx='2.5' fill='none' stroke='%23e8b04b' stroke-width='1.9'/%3E%3Cpath d='M12 8v16M20 8v16' stroke='%23e8b04b' stroke-width='1.9'/%3E%3C/svg%3E">
<script>
/* Set the theme before first paint so there is no flash of the wrong one. */
try {
  var t = localStorage.getItem('cinemelb-theme');
  if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="./assets/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to showtimes</a>

<header class="top">
  <div class="top-inner">
    <a class="brand" href="#/" aria-label="cinemelb — today's showtimes">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <rect x="4" y="6.5" width="24" height="19" rx="3"
              fill="none" stroke="currentColor" stroke-width="2.1"/>
        <path d="M11 6.5v19M21 6.5v19" stroke="currentColor" stroke-width="2.1"/>
        <path d="M6.8 11.5h2.4M6.8 16h2.4M6.8 20.5h2.4M22.8 11.5h2.4M22.8 16h2.4M22.8 20.5h2.4"
              stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">cinemelb</span>
    </a>

    <form class="search" id="search" role="search" autocomplete="off">
      <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M12.7 12.7 17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <input id="q" type="search" name="q" placeholder="Search a film…"
             aria-label="Search for a film" autocomplete="off" spellcheck="false"
             enterkeyhint="search" role="combobox" aria-expanded="false"
             aria-controls="suggest" aria-autocomplete="list" aria-haspopup="listbox">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
      <div class="suggest" id="suggest" role="listbox" aria-label="Film suggestions" hidden></div>
    </form>

    <div class="top-meta">
      <span class="clock" id="clock" title="Time in Melbourne"></span>
      <button class="icon-btn" id="theme" type="button" aria-label="Switch colour theme" title="Switch colour theme">
        <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="M15.5 12.2A6.5 6.5 0 0 1 7.8 4.5a6.5 6.5 0 1 0 7.7 7.7Z"
                fill="currentColor"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<nav class="rail" id="rail" aria-label="Choose a day"></nav>

<div class="filters" id="filters"></div>

<div class="nearbar" id="nearbar">
  <div class="near-row">
    <button class="near-me" id="near-me" type="button" title="Use my location">
      <svg class="near-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <path d="M10 18.2s6.1-5.3 6.1-9.6a6.1 6.1 0 1 0-12.2 0c0 4.3 6.1 9.6 6.1 9.6Z"
              fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <circle cx="10" cy="8.4" r="2.2" fill="currentColor"/>
      </svg>
      <span>Near me</span>
    </button>
    <form class="near-form" id="near-form" role="search" autocomplete="off">
      <input id="near-q" type="text" name="near" spellcheck="false"
             placeholder="or enter a suburb or address"
             aria-label="Suburb or address, or use my location"
             enterkeyhint="search">
    </form>
  </div>
  <p class="near-status" id="near-status" role="status" aria-live="polite"></p>
</div>

<main class="main" id="main" tabindex="-1">
  <div class="loading">
    <div class="spinner" aria-hidden="true"></div>
    <p>Loading showtimes…</p>
  </div>
</main>

<footer class="foot">
  <p id="foot-meta"></p>
  <p class="foot-note" id="foot-ratings" hidden></p>
  <p class="foot-note" id="foot-posters" hidden></p>
  <p class="foot-note">Session times are scraped from each cinema's own website and can change.
    Confirm with the venue before travelling.</p>
</footer>

<script src="./assets/app.js"></script>
</body>
</html>
