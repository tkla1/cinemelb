<!DOCTYPE html>
<html lang="en-AU" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cinemelb — Melbourne cinema showtimes</title>
<meta name="description" content="Every film at every Melbourne cinema — multiplex, arthouse and independent — in one page. Search a film, browse a day, or see what is still catchable later today.">
<meta name="theme-color" content="#0b0b14">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b14'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23e8b04b' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23e8b04b'/%3E%3C/svg%3E">
<script>
/* Set the theme before first paint so there is no flash of the wrong one. */
try {
  var t = localStorage.getItem('cinemelb-theme');
  if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="./assets/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to showtimes</a>

<header class="top">
  <div class="top-inner">
    <a class="brand" href="#/" aria-label="cinemelb — today's showtimes">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="16" cy="16" r="3" fill="currentColor"/>
        <path d="M16 4v4M16 24v4M4 16h4M24 16h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">cinemelb</span>
    </a>

    <form class="search" id="search" role="search" autocomplete="off">
      <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M12.7 12.7 17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <input id="q" type="search" name="q" placeholder="Search a film…"
             aria-label="Search for a film" autocomplete="off" spellcheck="false"
             enterkeyhint="search" role="combobox" aria-expanded="false"
             aria-controls="suggest" aria-autocomplete="list">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
      <div class="suggest" id="suggest" role="listbox" aria-label="Film suggestions" hidden></div>
    </form>

    <div class="top-meta">
      <span class="clock" id="clock" title="Time in Melbourne"></span>
      <button class="icon-btn" id="theme" type="button" aria-label="Switch colour theme" title="Switch colour theme">
        <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="M15.5 12.2A6.5 6.5 0 0 1 7.8 4.5a6.5 6.5 0 1 0 7.7 7.7Z"
                fill="currentColor"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<nav class="rail" id="rail" aria-label="Choose a day"></nav>

<div class="filters" id="filters"></div>

<main class="main" id="main" tabindex="-1">
  <div class="loading">
    <div class="spinner" aria-hidden="true"></div>
    <p>Loading showtimes…</p>
  </div>
</main>

<footer class="foot">
  <p id="foot-meta"></p>
  <p class="foot-note">Session times are scraped from each cinema's own website and can change.
    Confirm with the venue before travelling.</p>
</footer>

<script src="./assets/app.js"></script>
</body>
</html>
