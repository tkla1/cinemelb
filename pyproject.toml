[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinemelb"
version = "1.0.0"
description = "Query film session times across every cinema in Melbourne, independents included."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "typer>=0.12",
    "rich>=13.7",
    "tzdata>=2024.1",
]

[project.scripts]
cinemelb = "cinemelb.cli:run"

[tool.setuptools.packages.find]
include = ["cinemelb*"]

[dependency-groups]
dev = [
    "playwright>=1.65.2",
]
